# House-line CI (byte-near copy of the package repos' ci.yml). Deviations,
# each with a reason: no "cp .env.example .env" step — the Makefile creates
# .env from .env.example on its own (a missing include is remade); paths
# include support/ and .env.example (the template's own surface); "make
# phpunit" instead of phpunit-coverage (the
# delivered test suite is intentionally empty — coverage of nothing is noise).
# Docker Hub login only runs when the DOCKER_PAT secret exists, so a freshly
# derived project passes CI before configuring any secret. The smoke job is
# template-specific: it guards the core promise that the delivery state runs
# without configuration (`make start` on SQLite, /health answers 200).
name: CI Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'composer.json'
      - '.github/workflows/**'
      - 'Makefile'
      - 'support/**'
      - 'phpcs.xml'
      - 'phpstan.neon'
      - 'phpunit.xml'
      - '.env.example'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'composer.json'
      - '.github/workflows/**'
      - 'Makefile'
      - 'support/**'
      - 'phpcs.xml'
      - 'phpstan.neon'
      - 'phpunit.xml'
      - '.env.example'
  workflow_dispatch:

jobs:
  phpcs:
    name: phpcs
    runs-on: ubuntu-latest
    env:
      HAS_DOCKER_PAT: ${{ secrets.DOCKER_PAT != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Check env files for secrets
        run: bash support/check-env-secrets.sh --tree

      - name: Login to Docker Hub
        if: ${{ github.actor != 'dependabot[bot]' && env.HAS_DOCKER_PAT == 'true' }}
        env:
          DOCKER_CONFIG: /tmp/.docker
        run: |
          mkdir -p $DOCKER_CONFIG
          echo "${{ secrets.DOCKER_PAT }}" | docker login -u "${{ secrets.DOCKER_USER_NAME }}" --password-stdin

      - name: Install dependencies
        run: make install

      - name: Check Code Standards
        run: make phpcs

      - name: Cleanup
        if: always()
        run: make remove

      - name: Logout from Docker Hub
        if: always()
        env:
          DOCKER_CONFIG: /tmp/.docker
        run: docker logout

  phpstan:
    name: phpstan
    runs-on: ubuntu-latest
    env:
      HAS_DOCKER_PAT: ${{ secrets.DOCKER_PAT != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Login to Docker Hub
        if: ${{ github.actor != 'dependabot[bot]' && env.HAS_DOCKER_PAT == 'true' }}
        env:
          DOCKER_CONFIG: /tmp/.docker
        run: |
          mkdir -p $DOCKER_CONFIG
          echo "${{ secrets.DOCKER_PAT }}" | docker login -u "${{ secrets.DOCKER_USER_NAME }}" --password-stdin

      - name: Install dependencies
        run: make install

      - name: Run PHPStan
        run: make phpstan

      - name: Cleanup
        if: always()
        run: make remove

      - name: Logout from Docker Hub
        if: always()
        env:
          DOCKER_CONFIG: /tmp/.docker
        run: docker logout

  tests:
    name: tests
    runs-on: ubuntu-latest
    env:
      HAS_DOCKER_PAT: ${{ secrets.DOCKER_PAT != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Login to Docker Hub
        if: ${{ github.actor != 'dependabot[bot]' && env.HAS_DOCKER_PAT == 'true' }}
        env:
          DOCKER_CONFIG: /tmp/.docker
        run: |
          mkdir -p $DOCKER_CONFIG
          echo "${{ secrets.DOCKER_PAT }}" | docker login -u "${{ secrets.DOCKER_USER_NAME }}" --password-stdin

      - name: Install dependencies
        run: make install

      - name: Run PHPUnit Tests
        env:
          HOME: /home/runner
        run: make phpunit

      - name: Cleanup
        if: always()
        run: make remove

      - name: Logout from Docker Hub
        if: always()
        env:
          DOCKER_CONFIG: /tmp/.docker
        run: docker logout

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    env:
      HAS_DOCKER_PAT: ${{ secrets.DOCKER_PAT != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Login to Docker Hub
        if: ${{ github.actor != 'dependabot[bot]' && env.HAS_DOCKER_PAT == 'true' }}
        env:
          DOCKER_CONFIG: /tmp/.docker
        run: |
          mkdir -p $DOCKER_CONFIG
          echo "${{ secrets.DOCKER_PAT }}" | docker login -u "${{ secrets.DOCKER_USER_NAME }}" --password-stdin

      - name: Install dependencies
        run: make install

      - name: Start the delivery stack
        run: make start

      - name: Probe /health
        run: |
          PORT=$(grep -E '^HTTP_PORT=' .env.example | cut -d= -f2)
          curl -fsS --retry 3 --retry-delay 2 --retry-all-errors "http://localhost:${PORT}/health"

      - name: Show container state on failure
        if: failure()
        run: |
          docker compose --profile "*" ps -a
          docker compose logs

      - name: Cleanup
        if: always()
        run: make remove

      - name: Logout from Docker Hub
        if: always()
        env:
          DOCKER_CONFIG: /tmp/.docker
        run: docker logout
