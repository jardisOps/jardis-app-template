; Upload limits of the stack (Bescheid L3: 12M).
;
; The php-image-builder images expose no ENV key for these two directives, so
; the template carries them as a mounted ini (support/docker-compose.yml, app +
; phpcli + worker) — read after the image defaults, before the entrypoint's
; 99-runtime-config.ini, which does not set them. post_max_size must stay >=
; upload_max_filesize. nginx admits larger bodies on purpose
; (NGINX_CLIENT_MAX_BODY_SIZE in the root .env); PHP is the binding limit.
upload_max_filesize = 12M
post_max_size = 12M
